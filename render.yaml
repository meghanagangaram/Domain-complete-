services:
  - type: web
    name: galactic-archive-rag
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    workingDirectory: backend
    envVars:
      - key: GEMINI_API_KEY
        sync: false
    healthCheckPath: /api/documents
